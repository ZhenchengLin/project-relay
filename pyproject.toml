[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "project-relay"
version = "2.2.3"
description = "Relay ADE: Claude plans, ChatGPT writes one Bash block, your machine runs it — through your own browser, no API keys."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []
license = {text = "MIT"}
authors = [{name = "Zhencheng Lin"}]
keywords = ["chatgpt", "claude", "agent", "automation", "terminal", "browser-extension", "developer-tools"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development",
]

[project.urls]
Homepage = "https://github.com/ZhenchengLin/project-relay"
Issues = "https://github.com/ZhenchengLin/project-relay/issues"

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
prelay = "project_relay.cli:main"
prelayd = "project_relay.relay.server:main"

[tool.setuptools.packages.find]
include = ["project_relay*"]

[tool.setuptools.package-data]
"project_relay.relay" = ["extension/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
